services:
  api:
    image: hygeia-api:dev
    build: .
    env_file: .env.staging
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8082:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
